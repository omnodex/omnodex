# CI - runs on pushes to main and pull requests.
# Gated by the CI_ENABLED repository variable so the workflow can be
# committed while the repo is still private without burning Actions minutes.
# To activate: Settings > Variables > Actions > New variable > CI_ENABLED = true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by the Release workflow, which publishes only if this passes.
  workflow_call:

jobs:
  build-and-test:
    if: vars.CI_ENABLED == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing should not hide how the others did.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm install

      - name: Check project references
        run: npm run check:refs

      - name: Check for internal references
        run: npm run check:internal-refs

      - name: Build (tsc)
        run: npx tsc -b

      - name: Typecheck the dashboard page
        run: npm run typecheck:dashboard -w @omnodex/cli

      - name: Unit tests
        # bash on every OS, including the Windows runner (Git Bash).
        shell: bash
        run: |
          node --test $(find packages/*/test scripts/test -name '*.test.mjs' ! -name '*.integration.test.mjs')
