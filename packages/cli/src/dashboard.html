<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:        #0a0e27;
  --navy-card:   #151d3b;
  --navy-light:  #1c2445;
  --navy-border: #2a3f5f;
  --cyan:        #00d9ff;
  --cyan-dim:    rgba(0,217,255,0.15);
  --mint:        #4ade80;
  --mint-dim:    rgba(74,222,128,0.15);
  --orange:      #f1610f;
  --orange-dim:  rgba(241,97,15,0.15);
  --red:         #ef4444;
  --red-dim:     rgba(239,68,68,0.15);
  --yellow:      #facc15;
  --yellow-dim:  rgba(250,204,21,0.15);
  --slate:       #8b9ec2;
  --white:       #ffffff;
  --sans:        'Inter', system-ui, sans-serif;
  --mono:        'IBM Plex Mono', monospace;
}

body {
  font-family: var(--sans);
  background: var(--navy);
  color: var(--white);
  line-height: 1.5;
  min-height: 100vh;
}

/* --- Layout --- */
.app {
  max-width: 1440px;
  margin: 0 auto;
  padding: 20px 24px 40px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--navy-border);
  margin-bottom: 24px;
}

.logo {
  display: flex;
  align-items: center;
}

.header-meta {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--slate);
}

/* --- Session selector --- */
.session-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.session-bar label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.session-bar select {
  background: var(--navy-card);
  color: var(--white);
  border: 1px solid var(--navy-border);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 13px;
  min-width: 320px;
  cursor: pointer;
}

.session-bar select:focus {
  outline: none;
  border-color: var(--cyan);
}

/* --- Session details --- */
.session-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 24px;
  background: var(--navy-card);
  border: 1px solid var(--navy-border);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 16px;
  font-size: 13px;
}

.sd-col {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.sd-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px solid rgba(42,63,95,0.3);
}

.sd-row:last-child {
  border-bottom: none;
}

.sd-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  flex-shrink: 0;
}

.sd-value {
  color: var(--white);
  text-align: right;
  word-break: break-all;
  margin-left: 16px;
}

.sd-mono {
  font-family: var(--mono);
  font-size: 12px;
}

/* --- New event animation --- */
@keyframes event-glow {
  0%   { background: rgba(0,217,255,0.15); }
  100% { background: transparent; }
}

.timeline-item.new-arrival {
  animation: event-glow 1.5s ease-out;
}

.timeline-session-badge {
  font-family: var(--mono);
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  letter-spacing: 0.03em;
  display: inline-block;
  margin-right: 6px;
  vertical-align: middle;
}

/* --- Stats row --- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--navy-card);
  border: 1px solid var(--navy-border);
  border-radius: 10px;
  padding: 16px 20px;
}

.stat-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.stat-value.cyan  { color: var(--cyan); }
.stat-value.mint  { color: var(--mint); }
.stat-value.orange { color: var(--orange); }

.stat-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  margin-top: 2px;
}

/* --- Panel grid --- */
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

.panel {
  background: var(--navy-card);
  border: 1px solid var(--navy-border);
  border-radius: 10px;
  overflow: hidden;
}

.panel-full {
  grid-column: 1 / -1;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--navy-border);
}

.panel-title {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--cyan);
}

.panel-badge {
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 600;
}

.source-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  display: inline-block;
}

.panel-body {
  padding: 20px;
}

/* --- Connection Graph --- */
.graph-container {
  position: relative;
  min-height: 280px;
}

.graph-svg {
  width: 100%;
  height: 280px;
}

.graph-node {
  cursor: pointer;
}

.graph-node rect {
  rx: 8;
  ry: 8;
  stroke-width: 1.5;
}

.graph-node text {
  font-family: var(--mono);
  font-size: 11px;
  fill: var(--white);
  text-anchor: middle;
}

.graph-node .node-count {
  font-size: 10px;
  fill: var(--slate);
}

.graph-edge {
  stroke-width: 2;
  fill: none;
  opacity: 0.5;
}

.graph-edge-label {
  font-family: var(--mono);
  font-size: 9px;
  fill: var(--slate);
}

/* --- Credential ledger --- */
.cred-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.cred-table th {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--navy-border);
  font-weight: 500;
}

.cred-table td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(42,63,95,0.4);
  vertical-align: top;
}

.cred-type {
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
  display: inline-block;
}

.cred-type.bearer   { background: var(--cyan-dim); color: var(--cyan); }
.cred-type.api-key  { background: var(--orange-dim); color: var(--orange); }
.cred-type.password  { background: var(--red-dim); color: var(--red); }
.cred-type.token     { background: var(--yellow-dim); color: var(--yellow); }

.cred-value {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--slate);
  word-break: break-all;
}

.cred-tool {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--white);
}

.cred-server {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
}

/* --- Risk events --- */
.risk-list {
  list-style: none;
}

.risk-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(42,63,95,0.4);
  cursor: pointer;
  transition: background 0.15s;
  padding-left: 8px;
  padding-right: 8px;
  border-radius: 6px;
}

.risk-item:hover {
  background: rgba(0,217,255,0.04);
}

.risk-item.selected {
  background: rgba(241,97,15,0.08);
  border: 1px solid rgba(241,97,15,0.25);
  border-radius: 6px;
}

.risk-item:last-child {
  border-bottom: none;
}

.severity-badge {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}

.severity-CRITICAL { background: var(--red-dim); color: var(--red); }
.severity-HIGH     { background: var(--orange-dim); color: var(--orange); }
.severity-MEDIUM   { background: var(--yellow-dim); color: var(--yellow); }
.severity-LOW      { background: var(--mint-dim); color: var(--mint); }

.risk-desc {
  font-size: 13px;
  line-height: 1.5;
}

.risk-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  margin-top: 4px;
}

/* --- Event detail / timeline --- */
.timeline {
  list-style: none;
}

.timeline-item {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 12px;
  padding: 10px 8px;
  border-bottom: 1px solid rgba(42,63,95,0.3);
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.15s;
}

.timeline-item:hover {
  background: rgba(0,217,255,0.04);
}

.timeline-item.selected {
  background: rgba(0,217,255,0.08);
  border: 1px solid rgba(0,217,255,0.2);
}

.timeline-item.risk-flagged {
  border-left: 3px solid var(--orange);
}

.timeline-item.risk-flagged.selected {
  background: rgba(241,97,15,0.08);
  border: 1px solid rgba(241,97,15,0.25);
  border-left: 3px solid var(--orange);
}

.risk-flag-icon {
  font-size: 11px;
  margin-left: 6px;
  vertical-align: middle;
}

.timeline-time {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  padding-top: 2px;
}

.timeline-content {
  min-width: 0;
}

.timeline-tool {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--white);
}

.timeline-server {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--cyan);
  margin-left: 6px;
}

.timeline-status {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 8px;
}

.timeline-status.success { background: var(--mint-dim); color: var(--mint); }
.timeline-status.error   { background: var(--red-dim); color: var(--red); }
.timeline-status.in_progress { background: var(--yellow-dim); color: var(--yellow); }

.timeline-detail {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  margin-top: 4px;
}

/* --- Event detail drawer --- */
.detail-drawer {
  background: var(--navy-light);
  border: 1px solid var(--navy-border);
  border-radius: 8px;
  padding: 16px 20px;
  margin-top: 16px;
  display: none;
}

.detail-drawer.open {
  display: block;
}

.detail-drawer h4 {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--cyan);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 12px;
}

.detail-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(42,63,95,0.3);
  font-size: 13px;
}

.detail-row:last-child {
  border-bottom: none;
}

.detail-key {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
}

.detail-val {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--white);
  word-break: break-all;
}

.detail-val pre {
  background: var(--navy);
  border: 1px solid var(--navy-border);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  margin-top: 4px;
}

/* --- Risk score meter --- */
.risk-meter {
  display: flex;
  align-items: center;
  gap: 12px;
}

.risk-meter-bar {
  flex: 1;
  height: 8px;
  background: var(--navy);
  border-radius: 4px;
  overflow: hidden;
}

.risk-meter-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}

/* --- Empty state --- */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--slate);
  font-size: 14px;
}

.empty-state .icon {
  font-size: 32px;
  margin-bottom: 12px;
  opacity: 0.4;
}

/* --- Loading --- */
.loading {
  text-align: center;
  padding: 60px;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--cyan);
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.loading span {
  animation: pulse 1.5s ease-in-out infinite;
}

/* --- Scrollable panel body --- */
.panel-body-scroll {
  max-height: 400px;
  overflow-y: auto;
  padding: 20px;
}

.panel-body-scroll::-webkit-scrollbar {
  width: 6px;
}

.panel-body-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.panel-body-scroll::-webkit-scrollbar-thumb {
  background: var(--navy-border);
  border-radius: 3px;
}

/* --- Timezone toggle --- */
.tz-toggle {
  display: flex;
  align-items: center;
  gap: 0;
  font-family: var(--mono);
  font-size: 11px;
  margin-right: 16px;
}

.tz-btn {
  background: none;
  border: 1px solid var(--navy-border);
  color: var(--slate);
  padding: 4px 8px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  transition: all 0.15s;
}

.tz-btn:first-child {
  border-radius: 4px 0 0 4px;
}

.tz-btn:last-child {
  border-radius: 0 4px 4px 0;
  border-left: none;
}

.tz-btn.active {
  background: var(--cyan-dim);
  color: var(--cyan);
  border-color: var(--cyan);
}

.tz-btn.active + .tz-btn {
  border-left: 1px solid var(--navy-border);
}

/* --- Live badge --- */
.live-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  user-select: none;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.live-badge.live .live-dot {
  background: var(--mint);
  animation: live-pulse 1.5s ease-in-out infinite;
}

.live-badge.offline .live-dot { background: var(--slate); }
.live-badge.live  .live-label { color: var(--mint); }
.live-badge.offline .live-label { color: var(--slate); }

@keyframes live-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}

/* --- Risk-item flash on new arrival --- */
@keyframes risk-flash {
  0%   { background: rgba(241,97,15,0.25); }
  100% { background: transparent; }
}

.risk-item.new-arrival {
  animation: risk-flash 1.2s ease-out forwards;
}
</style>
</head>
<body>

<div class="app" id="app">

<script>
(function() {
  "use strict";

  const API = "";

  // --- State ---
  var useUtc = false;
  let sessions = [];
  let currentSession = null;
  let toolCalls = [];
  let fileEvents = [];
  let riskEvents = [];

  // --- API fetchers ---
  async function fetchJson(path) {
    const res = await fetch(API + path);
    if (!res.ok) throw new Error("API " + res.status);
    return res.json();
  }

  async function loadSessions() {
    sessions = await fetchJson("/api/sessions");
    return sessions;
  }

  async function loadSessionDetail(sessionId) {
    const [tc, fe, re] = await Promise.all([
      fetchJson("/api/sessions/" + sessionId + "/tool-calls"),
      fetchJson("/api/sessions/" + sessionId + "/file-events"),
      fetchJson("/api/sessions/" + sessionId + "/risk-events"),
    ]);
    toolCalls = tc;
    fileEvents = fe;
    riskEvents = re;
  }

  // --- Credential extraction ---
  function extractCredentials(toolCallsList) {
    const creds = [];
    const seen = new Set();

    const patterns = [
      { regex: /Bearer\s+([A-Za-z0-9_\-\.]+)/g, type: "bearer" },
      { regex: /sk_live_[A-Za-z0-9_\-]+/g, type: "api-key" },
      { regex: /sk_test_[A-Za-z0-9_\-]+/g, type: "api-key" },
      { regex: /api[_-]?key["']?\s*[:=]\s*["']?([A-Za-z0-9_\-]{16,})/gi, type: "api-key" },
      { regex: /token["']?\s*[:=]\s*["']?([A-Za-z0-9_\-]{16,})/gi, type: "token" },
      { regex: /password["']?\s*[:=]\s*["']?([^\s"',}]{4,})/gi, type: "password" },
      { regex: /ghp_[A-Za-z0-9]{36,}/g, type: "token" },
      { regex: /xoxb-[A-Za-z0-9\-]+/g, type: "token" },
    ];

    for (const tc of toolCallsList) {
      const paramStr = tc.parameters_json || "{}";
      for (const pat of patterns) {
        pat.regex.lastIndex = 0;
        let match;
        while ((match = pat.regex.exec(paramStr)) !== null) {
          const value = match[1] || match[0];
          const key = pat.type + ":" + value;
          if (seen.has(key)) continue;
          seen.add(key);
          creds.push({
            type: pat.type,
            value: maskCredential(value),
            rawValue: value,
            tool: tc.tool_name,
            server: tc.mcp_server,
            toolCallId: tc.tool_call_id,
          });
        }
      }
    }
    return creds;
  }

  function maskCredential(val) {
    if (val.length <= 8) return val;
    return val.slice(0, 8) + "..." + val.slice(-4);
  }

  // --- Renderers ---

  function interceptorColor(interceptor) {
    switch (interceptor) {
      case "mcp-proxy":       return { bg: "var(--cyan-dim)",   fg: "var(--cyan)" };
      case "claude-code-hook":return { bg: "var(--mint-dim)",   fg: "var(--mint)" };
      case "codex-hook":      return { bg: "var(--purple-dim)", fg: "var(--purple)" };
      case "antigravity-hook":return { bg: "var(--orange-dim)", fg: "var(--orange)" };
      case "cowork-desktop":  return { bg: "var(--blue-dim)",   fg: "var(--blue)" };
      default:                return { bg: "var(--slate-dim)",  fg: "var(--slate)" };
    }
  }

  function interceptorLabel(interceptor) {
    switch (interceptor) {
      case "mcp-proxy":        return "MCP Proxy";
      case "claude-code-hook": return "Claude Code";
      case "codex-hook":       return "Codex";
      case "antigravity-hook": return "Antigravity";
      case "cowork-desktop":   return "Cowork";
      default:                 return interceptor || "unknown";
    }
  }

  /** Shorten a session ID for display: keep prefix + first 8 hex chars. */
  function shortSessionId(sessionId) {
    if (!sessionId) return "";
    // e.g. "sess_abc12345-..." → "sess_abc12345"
    // or a full UUID → first 12 chars
    if (sessionId.startsWith("sess_")) {
      return sessionId.slice(0, Math.min(17, sessionId.length));
    }
    return sessionId.slice(0, 12);
  }

  /** Extract a friendly name from project_path (last segment). */
  function projectName(projectPath) {
    if (!projectPath) return null;
    var parts = projectPath.replace(/\\/g, "/").split("/").filter(Boolean);
    return parts.length > 0 ? parts[parts.length - 1] : null;
  }

  /** Format a relative "time ago" string from an ISO timestamp. */
  function timeAgo(iso) {
    if (!iso) return "";
    var now = Date.now();
    var then = new Date(iso).getTime();
    var sec = Math.floor((now - then) / 1000);
    if (sec < 60) return "just now";
    var min = Math.floor(sec / 60);
    if (min < 60) return min + "m ago";
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + "h ago";
    var days = Math.floor(hr / 24);
    return days + "d ago";
  }

  /** Count total events in a session (tool calls + file reads + file writes). */
  function totalEvents(s) {
    return (s.tool_call_count || 0) + (s.file_read_count || 0) + (s.file_write_count || 0);
  }

  function buildSessionLabel(s) {
    var prefix = s.status === "in_progress" ? "● " : "";
    var src = s.interceptor ? "[" + interceptorLabel(s.interceptor) + "] " : "";
    var name = projectName(s.project_path) || shortSessionId(s.session_id);
    var ts = s.last_event_at ? "  ·  " + timeAgo(s.last_event_at) : "";
    return prefix + src + name + ts;
  }

  function renderSessionSelect() {
    const sel = document.getElementById("session-select");
    const prev = sel.value;
    sel.innerHTML = "";

    // "All Active" option at the top
    var activeSessions = sessions.filter(function(s) { return totalEvents(s) > 0; });
    if (activeSessions.length > 0) {
      var allOpt = document.createElement("option");
      allOpt.value = "__all_active__";
      allOpt.textContent = "▶ All Sessions (" + activeSessions.length + ")";
      sel.appendChild(allOpt);
    }

    // Individual sessions, filtered for non-zero events
    var visible = sessions.filter(function(s) { return totalEvents(s) > 0; });
    for (const s of visible) {
      const opt = document.createElement("option");
      opt.value = s.session_id;
      opt.textContent = buildSessionLabel(s);
      sel.appendChild(opt);
    }
    // Restore previous selection if it still exists
    if (prev && [...sel.options].some(function(o) { return o.value === prev; })) {
      sel.value = prev;
    }
  }

  function renderSessionDetailsAllActive() {
    var el = document.getElementById("session-details");
    el.style.display = "grid";

    // Collect unique interceptor types
    var types = {};
    var servers = {};
    var latestEvent = "";
    for (var i = 0; i < allActiveSessions.length; i++) {
      var s = allActiveSessions[i];
      var label = interceptorLabel(s.interceptor);
      types[label] = (types[label] || 0) + 1;
      (s.mcp_servers || []).forEach(function(srv) { servers[srv] = true; });
      if (s.last_event_at && s.last_event_at > latestEvent) latestEvent = s.last_event_at;
    }

    var typesSummary = Object.keys(types).map(function(t) {
      var col = interceptorColor(
        t === "Claude Code" ? "claude-code-hook" :
        t === "Cowork" ? "cowork-desktop" :
        t === "Codex" ? "codex-hook" :
        t === "Antigravity" ? "antigravity-hook" :
        t === "MCP Proxy" ? "mcp-proxy" : "unknown"
      );
      return '<span class="source-badge" style="background:' + col.bg + ';color:' + col.fg + '">' + t + ' (' + types[t] + ')</span>';
    }).join("&nbsp;");

    var serverList = Object.keys(servers).sort();
    var lastFmt = latestEvent ? formatWithTz(latestEvent) + " (" + timeAgo(latestEvent) + ")" : "n/a";

    var left = '<div class="sd-col">';
    left += sdRow("Sessions", allActiveSessions.length + " total");
    left += sdRow("Types", typesSummary);
    left += '</div>';

    var right = '<div class="sd-col">';
    right += sdRow("Last Event", lastFmt);
    if (serverList.length > 0) {
      right += sdRowMono("MCP Servers", escHtml(serverList.join(", ")));
    }
    right += '</div>';

    el.innerHTML = left + right;
  }

  function renderStatsAllActive() {
    var totalTools = 0, totalReads = 0, totalWrites = 0, totalRisk = 0, serverSet = {};
    for (var i = 0; i < allActiveSessions.length; i++) {
      var s = allActiveSessions[i];
      totalTools += s.tool_call_count || 0;
      totalReads += s.file_read_count || 0;
      totalWrites += s.file_write_count || 0;
      totalRisk += s.risk_score || 0;
      (s.mcp_servers || []).forEach(function(srv) { serverSet[srv] = true; });
    }
    var riskLabel = totalRisk >= 60 ? "CRITICAL" : totalRisk >= 30 ? "HIGH" : totalRisk >= 15 ? "MEDIUM" : "LOW";
    var riskColor = totalRisk >= 60 ? "var(--red)" : totalRisk >= 30 ? "var(--orange)" : totalRisk >= 15 ? "var(--yellow)" : "var(--mint)";

    document.getElementById("stats-row").innerHTML = [
      statCard("Tool Calls", totalTools, "cyan", Object.keys(serverSet).length + " MCP servers"),
      statCard("File Reads", totalReads, "mint", totalWrites + " writes"),
      statCard("Risk Score", totalRisk, "orange", '<span style="color:' + riskColor + '">' + riskLabel + '</span>'),
      statCard("Sessions", allActiveSessions.length, "cyan", "active"),
    ].join("");
  }

  /** Format a status string for display. */
  function displayStatus(status) {
    if (status === "in_progress") return "Active";
    if (!status) return "Unknown";
    return status.charAt(0).toUpperCase() + status.slice(1);
  }

  /** Format an ISO timestamp with the local timezone abbreviation. */
  function formatWithTz(iso) {
    if (!iso) return "n/a";
    var d = new Date(iso);
    if (useUtc) {
      return d.toISOString().replace("T", " ").replace(/\.\d+Z$/, "") + " UTC";
    }
    var base = d.toLocaleString();
    var tzMatch = d.toLocaleTimeString("en-US", { timeZoneName: "short" }).match(/\s([A-Z]{2,5})$/);
    var tz = tzMatch ? " " + tzMatch[1] : "";
    return base + tz;
  }

  function sdRow(label, value) {
    return '<div class="sd-row"><span class="sd-label">' + label + '</span><span class="sd-value">' + value + '</span></div>';
  }

  function sdRowMono(label, value) {
    return '<div class="sd-row"><span class="sd-label">' + label + '</span><span class="sd-value sd-mono">' + value + '</span></div>';
  }

  function renderSessionDetails() {
    var s = currentSession;
    if (!s) return;
    var el = document.getElementById("session-details");
    el.style.display = "grid";

    var col = interceptorColor(s.interceptor);
    var typeBadge = s.interceptor
      ? '<span class="source-badge" style="background:' + col.bg + ';color:' + col.fg + '">'
        + interceptorLabel(s.interceptor) + '</span>'
      : '<span class="source-badge" style="background:var(--slate-dim);color:var(--slate)">unknown</span>';

    var statusLabel = displayStatus(s.status);
    var statusCol = s.status === "in_progress" ? "var(--mint)" :
                    s.status === "errored" ? "var(--red)" :
                    s.status === "interrupted" ? "var(--yellow)" : "var(--slate)";
    var statusBadge = '<span style="color:' + statusCol + '">' + escHtml(statusLabel) + '</span>';

    var startedFmt = formatWithTz(s.started_at);
    var lastFmt = s.last_event_at ? formatWithTz(s.last_event_at) + " (" + timeAgo(s.last_event_at) + ")" : "n/a";

    // Left column: identity
    var left = '<div class="sd-col">';
    left += sdRowMono("Session ID", escHtml(s.session_id));
    left += sdRow("Type", typeBadge);
    left += sdRow("Status", statusBadge);
    left += sdRow("User", escHtml(s.user));
    if (s.project_path) {
      left += sdRowMono("Project", escHtml(s.project_path));
    }
    left += '</div>';

    // Right column: timing & servers
    var right = '<div class="sd-col">';
    right += sdRow("Started", startedFmt);
    right += sdRow("Last Event", lastFmt);
    if ((s.mcp_servers || []).length > 0) {
      right += sdRowMono("MCP Servers", escHtml(s.mcp_servers.join(", ")));
    }
    right += '</div>';

    el.innerHTML = left + right;
  }

  function renderStats() {
    const s = currentSession;
    if (!s) return;

    const riskLabel = s.risk_score >= 60 ? "CRITICAL" :
                      s.risk_score >= 30 ? "HIGH" :
                      s.risk_score >= 15 ? "MEDIUM" : "LOW";
    const riskColor = s.risk_score >= 60 ? "var(--red)" :
                      s.risk_score >= 30 ? "var(--orange)" :
                      s.risk_score >= 15 ? "var(--yellow)" : "var(--mint)";

    const durationSec = s.duration_ms != null ? (s.duration_ms / 1000).toFixed(1) + "s" : "active";

      [
        statCard("Tool Calls", s.tool_call_count, "cyan", (s.mcp_servers || []).length + " MCP servers"),
        statCard("File Reads", s.file_read_count, "mint", s.file_write_count + " writes"),
        statCard("Risk Score", s.risk_score, "orange",
          '<span style="color:' + riskColor + '">' + riskLabel + '</span>'),

  function statCard(label, value, colorClass, sub) {
    return '<div class="stat-card">' +
      '<div class="stat-label">' + label + '</div>' +
      '<div class="stat-value ' + colorClass + '">' + value + '</div>' +
      '<div class="stat-sub">' + sub + '</div></div>';

  function renderConnectionGraph() {
    const svg = document.getElementById("graph-svg");
    const width = svg.clientWidth || 600;
    const height = 280;
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);

    // Build server nodes from tool calls
    const serverMap = {};
    for (const tc of toolCalls) {
      if (!serverMap[tc.mcp_server]) {
        serverMap[tc.mcp_server] = { name: tc.mcp_server, tools: new Set(), callCount: 0 };
      }
      serverMap[tc.mcp_server].tools.add(tc.tool_name);
      serverMap[tc.mcp_server].callCount++;
    }
    const servers = Object.values(serverMap);

    document.getElementById("server-count").textContent = servers.length + " servers";

    if (servers.length === 0) {
      svg.innerHTML = '<text x="' + width/2 + '" y="140" text-anchor="middle" fill="#8b9ec2" font-family="var(--mono)" font-size="13">No tool calls in this session</text>';
      return;
    }

    let svgContent = '';

    // Central "Claude" node
    const cx = width / 2;
    const cy = 60;
    svgContent += '<g class="graph-node">';
    svgContent += '<rect x="' + (cx - 50) + '" y="' + (cy - 20) + '" width="100" height="40" fill="var(--navy-light)" stroke="var(--cyan)" />';
    svgContent += '<text x="' + cx + '" y="' + (cy + 5) + '" fill="var(--cyan)" font-weight="600">Claude</text>';
    svgContent += '</g>';

    // Server nodes in an arc below
    const arcRadius = 160;
    const arcCenterY = cy + 20;
    const angleSpread = Math.min(Math.PI * 0.7, servers.length * 0.4);
    const startAngle = Math.PI / 2 - angleSpread / 2;

    servers.forEach(function(server, i) {
      const angle = servers.length === 1
        ? Math.PI / 2
        : startAngle + (i / (servers.length - 1)) * angleSpread;
      const nx = cx + Math.cos(angle) * arcRadius * (angle < Math.PI / 2 ? -1 : 1);
      // Recalculate for proper fan layout
      const spread = Math.min(width - 200, servers.length * 200);
      const sx = (width - spread) / 2 + (servers.length === 1 ? spread / 2 : (i / (servers.length - 1)) * spread);
      const sy = height - 70;
      const nodeW = Math.max(100, server.name.length * 10 + 40);

      // Edge from Claude to server
      const midY = (cy + 20 + sy - 20) / 2;
      svgContent += '<path class="graph-edge" d="M ' + cx + ' ' + (cy + 20) + ' C ' + cx + ' ' + midY + ' ' + sx + ' ' + midY + ' ' + sx + ' ' + (sy - 20) + '" stroke="var(--cyan)" opacity="0.3" />';

      // Call count label on edge
      svgContent += '<text class="graph-edge-label" x="' + ((cx + sx) / 2) + '" y="' + (midY - 4) + '" text-anchor="middle">' + server.callCount + ' calls</text>';

      // Server node
      svgContent += '<g class="graph-node">';
      svgContent += '<rect x="' + (sx - nodeW/2) + '" y="' + (sy - 20) + '" width="' + nodeW + '" height="44" fill="var(--navy-light)" stroke="var(--navy-border)" />';
      svgContent += '<text x="' + sx + '" y="' + (sy) + '" font-weight="500">' + escHtml(server.name) + '</text>';
      svgContent += '<text x="' + sx + '" y="' + (sy + 14) + '" class="node-count">' + server.tools.size + ' tools</text>';
      svgContent += '</g>';
    });

    svg.innerHTML = svgContent;
  }

        '<td class="cred-value">' + escHtml(c.value) + '</td>' +

  function renderRiskEvents() {

    if (riskEvents.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">&#x2705;</div>No risk events detected in this session.</div>';

  function renderTimeline() {
    const container = document.getElementById("timeline-body");
    document.getElementById("event-count").textContent = toolCalls.length + " calls";

    if (toolCalls.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">&#x23F3;</div>No tool calls in this session.</div>';
      return;
    }

    // Build a set of tool_call_ids that have risk events
    const riskFlaggedIds = new Set(riskEvents.map(function(r) { return r.related_event_id; }));

    let html = '<ul class="timeline">';
    for (const tc of toolCalls) {
      const statusClass = tc.status || "in_progress";
      const isFlagged = riskFlaggedIds.has(tc.tool_call_id);
      const flaggedClass = isFlagged ? ' risk-flagged' : '';
      var sessionBadge = "";
      if (allActiveMode) {
        var badgeSession = sessions.find(function(ss) { return ss.session_id === tc.session_id; });
        if (badgeSession) {
          var bCol = interceptorColor(badgeSession.interceptor);
          var bName = projectName(badgeSession.project_path) || shortSessionId(badgeSession.session_id);
          sessionBadge = '<span class="timeline-session-badge" style="background:' + bCol.bg + ';color:' + bCol.fg + '">' + escHtml(bName) + '</span>';
        }
      }
      html += '<li class="timeline-item' + flaggedClass + '" data-tcid="' + escAttr(tc.tool_call_id) + '">' +
        '<div class="timeline-time">' + formatTime(tc.started_at) + '</div>' +
        '<div class="timeline-content">' +
          sessionBadge +
          '<span class="timeline-tool">' + escHtml(tc.tool_name) + '</span>' +
          '<span class="timeline-server">' + escHtml(tc.mcp_server) + '</span>' +
          '<span class="timeline-status ' + statusClass + '">' + escHtml(tc.status) + '</span>' +
          (isFlagged ? '<span class="risk-flag-icon" title="Risk event flagged">&#x26A0;&#xFE0F;</span>' : '') +
          (tc.duration_ms != null ? '<div class="timeline-detail">' + tc.duration_ms + 'ms / ' + (tc.response_bytes || 0) + ' bytes</div>' : '') +
        '</div>' +
        '</li>';
    }
    html += '</ul>';
    container.innerHTML = html;

    container.querySelectorAll(".timeline-item").forEach(function(item) {
      item.addEventListener("click", function() {
        showToolCallDetail(item.dataset.tcid);
      });
    });

  function showToolCallDetail(toolCallId) {
    const tc = toolCalls.find(function(t) { return t.tool_call_id === toolCallId; });
    if (!tc) return;

    // Highlight selected in timeline
    document.querySelectorAll(".timeline-item").forEach(function(el) {
      el.classList.toggle("selected", el.dataset.tcid === toolCallId);
    });

    // If this tool call has a matching risk event, highlight it; otherwise clear
    const matchingRiskItem = document.querySelector('.risk-item[data-reid="' + CSS.escape(toolCallId) + '"]');
    document.querySelectorAll(".risk-item").forEach(function(el) {
      el.classList.toggle("selected", el === matchingRiskItem);
    });

    let params;
    try { params = JSON.parse(tc.parameters_json); } catch(e) { params = tc.parameters_json; }

    const container = document.getElementById("detail-body");
    container.innerHTML =
      '<h4 style="font-family:var(--mono);font-size:12px;color:var(--cyan);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:16px;">Tool Call Detail</h4>' +
      detailRow("Tool Call ID", tc.tool_call_id) +
      detailRow("Tool", tc.tool_name) +
      detailRow("MCP Server", tc.mcp_server) +
      detailRow("Status", '<span class="timeline-status ' + tc.status + '">' + escHtml(tc.status) + '</span>') +
      detailRow("Started", formatWithTz(tc.started_at)) +
      detailRow("Ended", tc.ended_at ? formatWithTz(tc.ended_at) : "n/a") +
      detailRow("Duration", tc.duration_ms != null ? tc.duration_ms + " ms" : "n/a") +
      detailRow("Response", tc.response_bytes != null ? tc.response_bytes + " bytes" : "n/a") +
      (tc.error_message ? detailRow("Error", '<span style="color:var(--red)">' + escHtml(tc.error_message) + '</span>') : '') +
      detailRow("Parameters", '<pre>' + escHtml(JSON.stringify(params, null, 2)) + '</pre>');

  function showRiskDetail(relatedEventId, sourceRiskItem) {
    const risk = riskEvents.find(function(r) { return r.related_event_id === relatedEventId; });
    if (!risk) return;

    // Highlight the selected risk item in the risk list
    document.querySelectorAll(".risk-item").forEach(function(el) {
      el.classList.toggle("selected", el === sourceRiskItem);
    });

    // Scroll to, select, and highlight the matching timeline entry
    const timelineItem = document.querySelector('.timeline-item[data-tcid="' + CSS.escape(relatedEventId) + '"]');
    if (timelineItem) {
      document.querySelectorAll(".timeline-item").forEach(function(el) {
        el.classList.toggle("selected", el === timelineItem);
      });
      timelineItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // Also try to find the related tool call
    const relatedTc = toolCalls.find(function(t) { return t.tool_call_id === relatedEventId; });

    const container = document.getElementById("detail-body");
    let html = '<h4 style="font-family:var(--mono);font-size:12px;color:var(--cyan);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:16px;">Risk Event Detail</h4>' +
      detailRow("Severity", '<span class="severity-badge severity-' + risk.severity + '">' + risk.severity + '</span>') +
      detailRow("Category", risk.category) +
      detailRow("Description", risk.description) +
      detailRow("Rule", risk.rule_id) +
      detailRow("Detected", formatWithTz(risk.detected_at)) +
      detailRow("Related Event", risk.related_event_id);

    if (relatedTc) {
      let params;
      try { params = JSON.parse(relatedTc.parameters_json); } catch(e) { params = relatedTc.parameters_json; }
      html += '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--navy-border);">' +
        '<h4 style="font-family:var(--mono);font-size:12px;color:var(--orange);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px;">Related Tool Call</h4>' +
        detailRow("Tool", relatedTc.tool_name) +
        detailRow("Server", relatedTc.mcp_server) +
        detailRow("Parameters", '<pre>' + escHtml(JSON.stringify(params, null, 2)) + '</pre>') +

  function detailRow(key, val) {
    return '<div class="detail-row"><div class="detail-key">' + escHtml(key) + '</div><div class="detail-val">' + val + '</div></div>';
  }

  // --- Helpers ---
  function formatTime(iso) {
    if (!iso) return "n/a";
    try {
      const d = new Date(iso);
      if (useUtc) {
        return String(d.getUTCHours()).padStart(2, "0") + ":" +
               String(d.getUTCMinutes()).padStart(2, "0") + ":" +
               String(d.getUTCSeconds()).padStart(2, "0") + "." +
               String(d.getUTCMilliseconds()).padStart(3, "0");
      }
      return d.toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }) +
        "." + String(d.getMilliseconds()).padStart(3, "0");
    } catch(e) {
      return iso;
    }
  }

  function escHtml(str) {
    if (str == null) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function escAttr(str) {
    return escHtml(str);
  }

  // --- Init ---
  async function init() {
    try {
      await loadSessions();

      if (sessions.length === 0) {
        document.getElementById("loading").innerHTML =
          '<div class="empty-state"><div class="icon">&#x1F4ED;</div>No sessions found. Run <code style="color:var(--cyan)">omnodex spike</code> to generate demo data, then refresh.</div>';
        return;
      }

      renderSessionSelect();

      const sel = document.getElementById("session-select");
      sel.addEventListener("change", async function() {
        await selectSession(sel.value);
      });

      // Default to "All Sessions" view
      var hasVisible = sessions.some(function(s) { return totalEvents(s) > 0; });
      if (hasVisible) {
        await selectSession("__all_active__");
      } else {
        await selectSession(sessions[0].session_id);
      }

      document.getElementById("loading").style.display = "none";
      document.getElementById("main").style.display = "block";
    } catch (err) {
      document.getElementById("loading").innerHTML =
        '<div style="color:var(--red)">Failed to load: ' + escHtml(err.message) + '</div>';
      console.error(err);
    }
  }

  var allActiveMode = false;
  var allActiveSessions = [];

  async function selectSession(sessionId) {
    if (sessionId === "__all_active__") {
      allActiveMode = true;
      allActiveSessions = sessions.filter(function(s) { return totalEvents(s) > 0; });
      currentSession = null;

      // Load detail for all active sessions and merge
      toolCalls = [];
      fileEvents = [];
      riskEvents = [];
      await Promise.all(allActiveSessions.map(async function(s) {
        var [tc, fe, re] = await Promise.all([
          fetchJson("/api/sessions/" + s.session_id + "/tool-calls"),
          fetchJson("/api/sessions/" + s.session_id + "/file-events"),
          fetchJson("/api/sessions/" + s.session_id + "/risk-events"),
        ]);
        toolCalls = toolCalls.concat(tc);
        fileEvents = fileEvents.concat(fe);
        riskEvents = riskEvents.concat(re);
      }));
      // Sort merged events by timestamp
      toolCalls.sort(function(a, b) { return (b.started_at || "").localeCompare(a.started_at || ""); });
      riskEvents.sort(function(a, b) { return (b.detected_at || "").localeCompare(a.detected_at || ""); });

      renderSessionDetailsAllActive();
      renderStatsAllActive();
      renderConnectionGraph();
      renderCredentialLedger();
      renderRiskEvents();
      renderTimeline();

      document.getElementById("detail-body").innerHTML =
        '<div class="empty-state"><div class="icon">&#x1F50D;</div>Click any tool call or risk event above to inspect its full context.</div>';
      return;
    }

    allActiveMode = false;
    allActiveSessions = [];
    currentSession = sessions.find(function(s) { return s.session_id === sessionId; });
    if (!currentSession) return;

    await loadSessionDetail(sessionId);
    renderSessionDetails();
    renderStats();
    renderConnectionGraph();
    renderCredentialLedger();
    renderRiskEvents();
    renderTimeline();

    document.getElementById("detail-body").innerHTML =
      '<div class="empty-state"><div class="icon">&#x1F50D;</div>Click any tool call or risk event above to inspect its full context.</div>';
  }

  // Handle window resize for graph
  window.addEventListener("resize", function() {
    if (currentSession) renderConnectionGraph();
  });


  // --- SSE client (streaming detection) ------------------------------------
  //
  // Connects to /api/events and incrementally updates in-memory state plus
  // re-renders only the affected panel on each push.  The LIVE badge in the
  // header shows connection status.

  function initSse() {
    var badge = document.getElementById("live-badge");

    function setLive(live) {
      if (!badge) return;
      badge.className = "live-badge " + (live ? "live" : "offline");
      badge.querySelector(".live-label").textContent = live ? "LIVE" : "OFFLINE";
    }

    var es = null;
    var retryTimer = null;

    function connect() {
      if (es) { try { es.close(); } catch(e) {} }
      es = new EventSource("/api/events");

      es.onopen = function() {
        setLive(true);
        if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      };

      es.onerror = function() {
        setLive(false);
        try { es.close(); } catch(e) {}
        es = null;
        if (!retryTimer) retryTimer = setTimeout(connect, 3000);
      };

      es.onmessage = function(evt) {
        var msg;
        try { msg = JSON.parse(evt.data); } catch(ex) { return; }
        handleSseMessage(msg);
      };
    }

    connect();
  }

  function handleSseMessage(msg) {
    switch (msg.type) {
      case "heartbeat":
      case "connected":
        return;

      case "session.upserted": {
        var existing = sessions.findIndex(function(s) { return s.session_id === msg.payload.session_id; });
        var isNew = existing === -1;
        if (isNew) {
          sessions.push(msg.payload);
        } else {
          sessions[existing] = msg.payload;
        }
        renderSessionSelect();

        // If the dashboard had no sessions, auto-show the first arriving one
        if (isNew && sessions.length === 1) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("main").style.display = "block";
          var sel = document.getElementById("session-select");
          sel.addEventListener("change", async function() {
            await selectSession(sel.value);
          });
          selectSession(msg.payload.session_id);
          return;
        }

        // Refresh stats for the session the user is currently viewing
        if (currentSession && currentSession.session_id === msg.payload.session_id) {
          currentSession = msg.payload;
          renderSessionDetails();
          renderStats();
        }
        if (allActiveMode) {
          // Update the session in our allActiveSessions list
          var aaIdx = allActiveSessions.findIndex(function(s) { return s.session_id === msg.payload.session_id; });
          if (aaIdx !== -1) {
            allActiveSessions[aaIdx] = msg.payload;
            renderSessionDetailsAllActive();
            renderStatsAllActive();
          }
        }
        return;
      }

      case "tool_call.inserted": {
        var isCurrentSession = currentSession && currentSession.session_id === msg.payload.session_id;
        var isAllActiveSession = allActiveMode && allActiveSessions.some(function(s) { return s.session_id === msg.payload.session_id; });
        if (!isCurrentSession && !isAllActiveSession) return;
        if (!toolCalls.find(function(tc) { return tc.tool_call_id === msg.payload.tool_call_id; })) {
          // Insert at the beginning (newest first) in all-active mode
          if (allActiveMode) {
            toolCalls.unshift(msg.payload);
          } else {
            toolCalls.push(msg.payload);
          }
          renderTimeline();
          renderConnectionGraph();
          renderCredentialLedger();
          // Animate the new entry
          setTimeout(function() {
            var items = document.querySelectorAll(".timeline-item");
            var target = allActiveMode ? items[0] : items[items.length - 1];
            if (target) {
              target.classList.add("new-arrival");
              setTimeout(function() { target.classList.remove("new-arrival"); }, 1500);
            }
          }, 50);
        }
        return;
      }

      case "tool_call.patched": {
        var isPatchCurrent = currentSession && currentSession.session_id === msg.payload.session_id;
        var isPatchAllActive = allActiveMode && allActiveSessions.some(function(s) { return s.session_id === msg.payload.session_id; });
        if (!isPatchCurrent && !isPatchAllActive) return;
        var idx = toolCalls.findIndex(function(tc) { return tc.tool_call_id === msg.payload.tool_call_id; });
        if (idx !== -1) {
          toolCalls[idx] = msg.payload;
          renderTimeline();
        }
        return;
      }

      case "file_event.inserted": {
        var isFileCurrent = currentSession && currentSession.session_id === msg.payload.session_id;
        var isFileAllActive = allActiveMode && allActiveSessions.some(function(s) { return s.session_id === msg.payload.session_id; });
        if (!isFileCurrent && !isFileAllActive) return;
        fileEvents.push(msg.payload);
        // Stats refresh arrives separately via session.upserted
        return;
      }

      case "risk_event.inserted": {
        var isRiskCurrent = currentSession && currentSession.session_id === msg.payload.session_id;
        var isRiskAllActive = allActiveMode && allActiveSessions.some(function(s) { return s.session_id === msg.payload.session_id; });
        if (!isRiskCurrent && !isRiskAllActive) return;
        var already = riskEvents.find(function(r) {
          return r.related_event_id === msg.payload.related_event_id && r.rule_id === msg.payload.rule_id;
        });
        if (!already) {
          riskEvents.push(msg.payload);
          renderRiskEvents();
          renderTimeline(); // re-render to show risk flag on the triggering tool call
          // Brief flash on the new item
          var body = document.getElementById("risk-body");
          if (body) {
            var last = body.querySelector(".risk-item:last-child");
            if (last) {
              last.classList.add("new-arrival");
              setTimeout(function() { last.classList.remove("new-arrival"); }, 1200);
            }
          }
        }
        return;
      }
    }
  }

  // --- Timezone toggle wiring ---
  (function() {
    var localBtn = document.getElementById("tz-local");
    var utcBtn = document.getElementById("tz-utc");
    // Set the local button label to the actual timezone abbreviation
    var tzMatch = new Date().toLocaleTimeString("en-US", { timeZoneName: "short" }).match(/\s([A-Z]{2,5})$/);
    if (tzMatch) localBtn.textContent = tzMatch[1];

    function setTz(isUtc, persist) {
      useUtc = isUtc;
      localBtn.classList.toggle("active", !isUtc);
      utcBtn.classList.toggle("active", isUtc);
      if (persist !== false) {
        try { localStorage.setItem("omnodex_tz", isUtc ? "utc" : "local"); } catch(e) {}
      }
      // Re-render everything that shows timestamps
      if (currentSession || allActiveMode) {
        renderSessionDetails();
        renderTimeline();
        renderRiskEvents();
      }
    }
    // Restore saved preference
    try {
      var saved = localStorage.getItem("omnodex_tz");
      if (saved === "utc") setTz(true, false);
    } catch(e) {}
    localBtn.addEventListener("click", function() { setTz(false); });
    utcBtn.addEventListener("click", function() { setTz(true); });
  })();

  initSse();
  init();
})();
</script>
